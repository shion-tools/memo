<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>MEMO LINE</title>
<style>
  :root { color-scheme: light; --ink:#111; --paper:#fff; --muted:#777; --line:#dedede; --bg:#f4f4f4; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .app { width:min(760px,100%); min-height:100dvh; margin:auto; background:var(--paper); display:flex; flex-direction:column; box-shadow:0 0 30px #0000000b; }
  header { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; padding:15px 18px; background:#111; color:#fff; }
  .avatar { width:38px; height:38px; border:1px solid #777; border-radius:50%; display:grid; place-items:center; font-size:19px; }
  .brand { font-weight:750; letter-spacing:.08em; }
  .sub { color:#bbb; font-size:11px; margin-top:3px; }
  .status { margin-left:auto; border:1px solid #666; border-radius:99px; padding:5px 9px; color:#ddd; font-size:11px; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; padding:11px 16px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); }
  button { font:inherit; cursor:pointer; }
  .clear { border:1px solid var(--line); background:#fff; border-radius:7px; padding:6px 10px; color:#333; }
  .messages { flex:1; padding:20px 14px 24px; display:flex; flex-direction:column; gap:13px; }
  .day { align-self:center; background:#eee; color:#555; border-radius:99px; padding:5px 12px; font-size:11px; margin:3px 0 7px; }
  .row { display:flex; justify-content:flex-end; align-items:flex-end; gap:7px; }
  .bubble { max-width:min(82%,520px); padding:11px 13px 8px; background:#111; color:#fff; border-radius:15px 15px 3px 15px; overflow-wrap:anywhere; white-space:pre-wrap; line-height:1.55; }
  .meta { color:#888; font-size:10px; white-space:nowrap; padding-bottom:3px; }
  .empty { margin:auto; text-align:center; color:#888; padding:55px 20px; }
  .empty .symbol { font-size:35px; color:#bbb; margin-bottom:12px; }
  .composer-wrap { position:sticky; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .composer { display:flex; gap:9px; align-items:flex-end; }
  textarea { flex:1; min-height:46px; max-height:140px; resize:none; border:1px solid #ccc; border-radius:23px; padding:12px 16px; font:inherit; line-height:1.4; outline:none; }
  textarea:focus { border-color:#111; }
  .send { width:46px; height:46px; flex:0 0 46px; border:0; border-radius:50%; background:#111; color:#fff; display:grid; place-items:center; }
  .send:disabled { background:#aaa; cursor:not-allowed; }
  .hint { text-align:center; color:#999; font-size:10px; margin-top:8px; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#222; color:#fff; padding:9px 14px; border-radius:99px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.show { opacity:1; }
  @media (prefers-reduced-motion:no-preference) { .bubble { animation:pop .16s ease-out; } @keyframes pop { from {opacity:.5; transform:translateY(4px)} to {opacity:1;transform:none} } }
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="avatar" aria-hidden="true">✉</div>
    <div><div class="brand">MEMO LINE</div><div class="sub">自分だけのメモスペース</div></div>
    <div class="status">● LOCAL</div>
  </header>
  <div class="toolbar">
    <span id="count">0件のメモ</span>
    <button class="clear" id="clearBtn" type="button">すべて削除</button>
  </div>
  <section class="messages" id="messages" aria-live="polite">
    <div class="empty" id="empty"><div class="symbol">▤</div><strong>メモはまだありません</strong><div style="font-size:12px;margin-top:7px">下の入力欄からメッセージを送信できます。</div></div>
  </section>
  <form class="composer-wrap" id="form">
    <div class="composer">
      <textarea id="message" rows="1" maxlength="5000" placeholder="メッセージを入力..." aria-label="メモの内容"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="送信" disabled>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12 20 4l-5 16-3-7-8-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m12 13 8-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="hint">Enterで送信 ・ Shift + Enterで改行　|　この端末内に保存</div>
  </form>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const KEY = "memo-line-local-v1";
  const messagesEl = document.getElementById("messages");
  const emptyEl = document.getElementById("empty");
  const form = document.getElementById("form");
  const input = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");
  const countEl = document.getElementById("count");
  const toastEl = document.getElementById("toast");
  let items = [];
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (Array.isArray(saved)) items = saved.filter(x => x && typeof x.text === "string" && typeof x.time === "number");
  } catch (_) { items = []; }

  const dateKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const dateLabel = d => `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const timeLabel = d => `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); }
    catch (_) { showToast("保存できませんでした。端末の空き容量を確認してください。"); }
  }
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toastEl.classList.remove("show"), 2200);
  }
  function render() {
    messagesEl.querySelectorAll(".day,.row").forEach(el => el.remove());
    emptyEl.hidden = items.length > 0;
    countEl.textContent = `${items.length}件のメモ`;
    let previousDay = "";
    for (const item of items) {
      const d = new Date(item.time);
      const key = dateKey(d);
      if (key !== previousDay) {
        const day = document.createElement("div");
        day.className = "day";
        day.textContent = dateLabel(d);
        messagesEl.appendChild(day);
        previousDay = key;
      }
      const row = document.createElement("div");
      row.className = "row";
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = timeLabel(d);
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = item.text;
      row.append(meta, bubble);
      messagesEl.appendChild(row);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function updateButton() { sendBtn.disabled = !input.value.trim(); }
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
    updateButton();
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    items.push({ text, time: Date.now() });
    save();
    input.value = "";
    input.style.height = "auto";
    updateButton();
    render();
    input.focus();
  });
  document.getElementById("clearBtn").addEventListener("click", () => {
    if (!items.length) { showToast("削除するメモはありません。"); return; }
    if (!confirm("すべてのメモを削除します。この操作は元に戻せません。よろしいですか？")) return;
    items = [];
    save();
    render();
    showToast("すべてのメモを削除しました。");
  });
  render();
  updateButton();
})();
</script>
</body>
</html>
